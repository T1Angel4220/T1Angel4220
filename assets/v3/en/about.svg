<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="About me: learning, first junior roles, cats and rock."><style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.bob{animation:bob 3.6s ease-in-out infinite}.bob2{animation:bob 3.6s ease-in-out -1.2s infinite}.bob3{animation:bob 3.6s ease-in-out -2.4s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pd{animation:pulse 1.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1c3d" /><stop offset="1" stop-color="#0a1226" /></linearGradient>
