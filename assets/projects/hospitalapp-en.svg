<svg xmlns="http://www.w3.org/2000/svg" width="640" height="376" viewBox="0 0 640 376" role="img" aria-labelledby="title"><title id="title">HospitalApp: hospital management with React, TypeScript and Zustand. View code.</title><style>.project-glow{animation:halo-breathe 7s ease-in-out infinite alternate}@keyframes halo-breathe{from{opacity:.4;transform:translate(0,0)}to{opacity:1;transform:translate(-15px,6px)}}@media(prefers-reduced-motion:reduce){.project-glow{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b172c"/><stop offset="1" stop-color="#122744"/></linearGradient><radialGradient id="halo"><stop stop-color="#65ddc8" stop-opacity=".16"/><stop offset="1" stop-color="#65ddc8" stop-opacity="0"/></radialGradient><linearGradient id="line"><stop stop-color="#65ddc8"/><stop offset="1" stop-color="#65ddc8" stop-opacity="0"/></linearGradient><clipPath id="card-clip"><rect x="1" y="1" width="638" height="358" rx="20"/></clipPath></defs><g clip-path="url(#card-clip)"><rect x="1" y="1" width="638" height="358" rx="20" fill="url(#bg)" stroke="#2b4260"/><circle class="project-glow" cx="551" cy="52" r="210" fill="url(#halo)"/><path d="M480 0v322M558 0v322M433 91h207M433 165h207M433 239h207" fill="none" stroke="#65ddc8" stroke-opacity=".055"/><rect x="32" y="29" width="7" height="7" rx="2" fill="#65ddc8"/><text x="51" y="40" fill="#a8bfd9" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2">🏥 HEALTH</text><text x="606" y="41" text-anchor="end" fill="#65ddc8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">02 / 04</text><g transform="translate(525 63) scale(.72)" fill="none" stroke="#65ddc8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M27 9h24v18h18v24H51v18H27V51H9V27h18Z"/><path d="m7 81 15-9 12 7 13-13 12 9 18-10"/></g><text x="32" y="139" fill="#f0f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" letter-spac