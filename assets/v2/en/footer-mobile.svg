<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="Thanks for stopping by.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09162f" />
      <stop offset="1" stop-color="#152447" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="230" rx="28" fill="url(#bg)" stroke="#2e4b70" />
  <text x="36" y="68" fill="#3fffe8" font-size="39" font-family="Arial,'Segoe UI',sans-serif" font-weight="700">Thanks for stopping by.</text>
  <text x="36" y="125" fill="#b8cbe8" font-size="29" font-family="Arial,'Segoe UI',sans-serif" font-weight="500">A little code, a little rock</text>
  <text x="36" y="165" fill="#b8cbe8" font-size="29" font-family="Arial,'Segoe UI',sans-serif" font-weight="500">and a cat or two.</text>
</svg>
