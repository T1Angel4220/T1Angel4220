name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/contributions.yml

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#e8eef7,#c4ddff,#8bbfff,#4e96e9,#1b5eb5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#70e1c1&color_dots=#142038,#1d3c63,#2866a4,#3c99dc,#82d9fa
      - name: Publish generated SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "Refresh public contribution animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
